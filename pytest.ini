[pytest]
testpaths = testcase
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
markers =
    smoke: 冒烟用例，覆盖核心正向流程
    crud: CRUD 套路用例
    auth: 鉴权相关用例
    negative: 反例 / 边界 / 异常用例
    dbcheck: 带数据库校验的用例
    manual: 手工测试，自动化跳过